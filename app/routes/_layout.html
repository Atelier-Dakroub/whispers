<script server>
  import { LOGO_DARK, SHARE, SPONSOR, stamp } from '../data/assets.js';
  import { DENSITY, all as readSettings, colorScheme } from '../data/settings.js';
  import { DEFAULT_HEADLINE, DEFAULT_INTERFACE, stackOf } from '../lib/fonts.js';
  import { directionOf } from '../lib/locale.js';
  import { origin } from '../lib/origin.js';
  import { stringsFor } from '../lib/strings.js';

  // This layout does not read a cookie, and that is a decision rather than an
  // omission. Reading one makes every page below it personal: the cache refuses
  // to hold it and the build refuses to write it. So the masthead says nothing
  // about who you are, and the admin lives behind /admin, whose own layout reads
  // the session. The reader's page stays cacheable.
  export default async ({ request }) => {
    const site = await readSettings();

    // Absolute, because og:url and og:image are the two URLs a scraper will not
    // resolve against the page it read them from.
    const base = origin(request);
    const card = await stamp(SHARE);

    return {
      site,
      scheme: colorScheme(site),
      // The config's `lang` is one value for the whole app; this site's language
      // is a setting, so it has to be written here or a French install claims to
      // be English.
      s: stringsFor(site.locale),
      density: DENSITY[site.density] ?? DENSITY.normal,
      // `0` rather than `none`, so the shorthand below still names a style and a
      // color and only the width changes.
      rule: site.rules ? '1px' : '0',
      lang: site.locale,
      dir: directionOf(site.locale),
      // Resolved here rather than in the template, so a stack that was renamed
      // or removed falls back instead of rendering an empty font-family.
      headline: stackOf(site.fontHeadline, DEFAULT_HEADLINE).css,
      ui: stackOf(site.fontInterface, DEFAULT_INTERFACE).css,
      // A version stamp, not the bytes. /logo is cached for a year, so a
      // replaced logo needs a different URL or nobody sees it.
      logo: await stamp(),
      logoDark: await stamp(LOGO_DARK),
      // The query is left off on purpose: the page worth sharing is the site,
      // and `/?page=4` pointing at itself would tell a scraper that page four
      // is a document of its own.
      //
      // `false` on the one prerendered page, where there is no request to read
      // a host from and SITE_URL may be unset — the tag is dropped rather than
      // built around a guess.
      canonical: base && request ? `${base}${new URL(request.url).pathname}` : false,
      // No og:image:width or :height beside it. Nothing here knows the size
      // without reading the whole file back on every render, and a scraper
      // measures the file anyway.
      card: base && card ? `${base}/share?v=${card}` : false,
      // The wide card when there is a picture for it, and the small one when
      // there is not — which is all X can draw from a title and a line of text.
      twitterCard: card ? 'summary_large_image' : 'summary',
      // og:locale is language_TERRITORY where everything else here is
      // language-TERRITORY.
      ogLocale: site.locale.replace('-', '_'),
      // The sponsor slot. Everything it needs is resolved here, so the template
      // states the markup and decides nothing.
      sponsorOn: site.sponsor && Boolean(site.sponsorText || (await stamp(SPONSOR))),
      sponsorText: site.sponsorText,
      sponsorLabel: site.sponsorLabel,
      sponsorImage: await stamp(SPONSOR),
      // `false` drops the attribute. An <a> with no href is not a link, which
      // is what a sponsor line without a URL should be.
      sponsorHref: site.sponsorUrl || false,
      // `sponsored` is what Google requires on a link somebody paid for, and a
      // site without it can take a manual action. `nofollow` is the older
      // spelling of the same thing, kept for engines that only read that one.
      sponsorRel: site.sponsorUrl ? 'sponsored nofollow noopener' : false,
      sponsorTarget: site.sponsorUrl && site.newTab ? '_blank' : false,
    };
  };
</script>

<html lang="${lang}" dir="${dir}" style="color-scheme: ${scheme}" />

<!-- The palette, the fonts and the density, set from the database on every
     render. `${…}` inside a <style> block is a compile error — text there
     reaches the page as written, so a value would land in code. An attribute is
     the way through, and an attribute is escaped. -->
<body
  style="--bg-l: ${site.bgLight}; --ink-l: ${site.inkLight}; --link-l: ${site.linkLight}; --bg-d: ${site.bgDark}; --ink-d: ${site.inkDark}; --link-d: ${site.linkDark}; --font-head: ${headline}; --font-ui: ${ui}; --leading: ${density.leading}; --row-pad: ${density.pad}; --headline-rule: ${rule}; --flash-l: ${site.breakingLight}; --flash-d: ${site.breakingDark}"
/>

<meta name="color-scheme" content="${scheme}" />

<!-- What a link to this site looks like pasted into Slack, iMessage or X.
     Every value is a setting or an upload, so a buyer's site describes the
     buyer's paper — there is no artwork shipped here to leave in place by
     mistake, and no card is drawn without one being uploaded. -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="${site.title}" />
<meta property="og:title" content="${site.title}" />
<meta property="og:locale" content="${ogLocale}" />
<meta property="og:description" if="site.tagline" content="${site.tagline}" />
<meta property="og:url" if="canonical" content="${canonical}" />
<meta property="og:image" if="card" content="${card}" />
<meta property="og:image:type" if="card" content="image/png" />
<meta property="og:image:alt" if="card" content="${site.title}" />
<meta name="twitter:card" content="${twitterCard}" />

<a class="skip" href="#headlines">${s.skip}</a>

<header class="masthead">
  <a class="wordmark" href="/">
    <!-- `prefers-color-scheme` is the reader's setting; `color-scheme` on
         <html> is this site's. They agree only when the theme is automatic, so
         the media query is used only then — a site pinned to dark must not hand
         the light artwork to a reader whose laptop is in light mode. -->
    <picture if="logo && logoDark && site.themeMode === 'auto'">
      <source media="(prefers-color-scheme: dark)" srcset="/logo?dark&amp;v=${logoDark}" />
      <img src="/logo?v=${logo}" alt="${site.title}" class="logo" />
    </picture>

    <img
      else-if="logoDark && site.themeMode === 'dark'"
      src="/logo?dark&amp;v=${logoDark}"
      alt="${site.title}"
      class="logo"
    />

    <img else-if="logo" src="/logo?v=${logo}" alt="${site.title}" class="logo" />

    <span else>${site.title}</span>
  </a>

  <p class="tagline" if="site.tagline">${site.tagline}</p>
</header>

<!-- Below the masthead and above the headlines, never inside the list. A
     reader takes in the whole list in one movement, and an interruption inside
     it removes the thing this product sells.

     The label is a disclosure. It is not decoration and it is not optional in
     several markets, so it renders whenever the slot does. -->
<aside class="sponsor" if="sponsorOn" aria-label="${sponsorLabel}">
  <span class="sponsor-label">${sponsorLabel}</span>
  <a class="sponsor-body" href="${sponsorHref}" rel="${sponsorRel}" target="${sponsorTarget}">
    <img
      if="sponsorImage"
      class="sponsor-image"
      src="/sponsor?v=${sponsorImage}"
      alt="${sponsorText}"
    />
    <span else>${sponsorText}</span>
  </a>
</aside>

<main id="headlines"><slot></slot></main>

<footer class="colophon">
  <a href="/feed.xml">${s.feed}</a>
  <a href="/login">${s.signIn}</a>

  <!-- On by default, off with a setting, and deliberately not enforced: the
       promise is that there is no key to enter and nothing counting installs,
       which a technical lock here would make false. The admin says what each
       license expects and trusts the owner. -->
  <a class="credit" if="site.credit" href="https://whispers.news" rel="noopener">
    ${s.poweredBy}
  </a>
</footer>
