<script server>
  import { count, sessionValue, signIn } from '../data/members.js';
  import { check, fail, keyFor, reset } from '../lib/throttle.js';

  export const prerender = false;

  const SESSION = {
    httpOnly: true,
    sameSite: /** @type {const} */ ('Lax'),
    path: '/',
    maxAge: 60 * 60 * 24 * 14,
  };

  /**
   * A path this site owns, or the admin.
   *
   * Resolved and origin-checked rather than pattern-matched. `/\\evil.example`
   * passes a `startsWith('//')` test and still lands on another host, because
   * the URL parser reads a backslash as a slash — so the only reliable question
   * is what the value actually resolves to.
   *
   * @param {unknown} value straight from the form or the query string
   * @param {string} base the current request URL
   * @returns {string} a same-origin path, or `/admin`
   */
  const safeNext = (value, base) => {
    try {
      const here = new URL(base);
      const there = new URL(String(value ?? ''), here);

      return there.origin === here.origin ? there.pathname + there.search : '/admin';
    } catch {
      return '/admin';
    }
  };

  export default async ({ action, url }) => {
    // Nobody has claimed this site yet, so there is nothing to sign in to.
    if ((await count()) === 0) return Response.redirect(new URL('/setup', url), 303);

    return {
      error: action?.error ?? null,
      email: action?.email ?? '',
      next: safeNext(new URL(url).searchParams.get('next'), url),
    };
  };

  export const POST = async ({ cookies, request, url }) => {
    const form = await request.formData();
    const email = String(form.get('email') ?? '');
    const next = safeNext(form.get('next'), url);

    const key = keyFor(request, email);
    const gate = check(key);

    if (!gate.allowed) {
      return {
        error: `Too many attempts. Try again in ${Math.ceil(gate.retryAfter / 60)} minutes.`,
        email,
      };
    }

    const member = await signIn(email, String(form.get('passphrase') ?? ''));

    if (!member) {
      fail(key);
      // One message for both failures. A different answer for an unknown
      // address than for a wrong passphrase tells whoever is asking which
      // addresses have accounts here.
      return { error: 'Those do not match an account.', email };
    }

    reset(key);

    // Signed, so the browser cannot invent one. The value carries a fingerprint
    // of the stored verifier as well as the id, so changing a passphrase ends
    // every session opened with the old one.
    const session = await sessionValue(member.id);
    if (!session) return { error: 'Those do not match an account.', email };

    await cookies.signed.set('session', session, SESSION);

    return Response.redirect(new URL(next, url), 303);
  };
</script>

<title>Sign in</title>
<meta name="robots" content="noindex" />

<div class="sheet">
  <h1>Sign in</h1>
  <p class="lede">For the people who post here.</p>

  <p class="notice bad" if="error" role="alert">${error}</p>

  <form method="post">
    <input type="hidden" name="next" value="${next}" />

    <label class="field" for="email">
      <span>Email</span>
      <input
        id="email"
        name="email"
        type="email"
        value="${email}"
        autocomplete="username"
        autocapitalize="off"
        spellcheck="false"
        required
      />
    </label>

    <label class="field" for="passphrase">
      <span>Passphrase</span>
      <input
        id="passphrase"
        name="passphrase"
        type="password"
        autocomplete="current-password"
        required
      />
    </label>

    <div class="actions">
      <button type="submit">Sign in</button>
    </div>
  </form>
</div>
